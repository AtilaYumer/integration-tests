name: Sync tests with tracked repositories

# Looks for changes in the tracked service repositories since the last sync. When something that can
# affect the API changed, Claude adds or refactors the integration tests, and the result is opened as a PR.
on:
  schedule:
    - cron: "0 5 * * 1-5"   # weekdays 05:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [tracked-repo-updated]

concurrency:
  group: sync-tests
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  SYNC_BRANCH: auto/sync-tests

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Skip while an earlier sync PR is still open
        id: guard
        run: |
          open=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "::notice::A sync PR from $SYNC_BRANCH is still open; merge or close it first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Detect changes
        id: detect
        if: steps.guard.outputs.skip == 'false'
        run: python3 scripts/tracked_repos.py detect
        env:
          GH_TOKEN: ${{ secrets.TRACKED_REPOS_TOKEN || github.token }}

      - uses: actions/setup-java@v6
        if: steps.detect.outputs.has_changes == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start services at their new heads
        if: steps.detect.outputs.has_changes == 'true'
        run: scripts/start-services.sh

      - name: Update tests with Claude
        if: steps.detect.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Follow the instructions in .github/prompts/sync-tests.md.
            The change summary is in .work/changes/summary.json (overall impact: ${{ steps.detect.outputs.impact }}).
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(mvn:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(curl:*)"

      - name: Run the updated suite
        id: verify
        if: steps.detect.outputs.has_changes == 'true'
        continue-on-error: true
        run: mvn -B verify

      - name: Record synced commits
        if: steps.detect.outputs.state_changed == 'true'
        run: |
          python3 scripts/tracked_repos.py record
          {
            echo "Automated sync of the integration tests with the tracked service repositories."
            echo
            echo "## What changed upstream"
            cat .work/changes/summary.md
            echo
            if [ -f .work/claude-report.md ]; then
              echo "## Test changes"
              cat .work/claude-report.md
              echo
            fi
            if [ "${{ steps.detect.outputs.has_changes }}" = "true" ]; then
              echo "## Verification"
              echo "\`mvn verify\` against the new service heads: **${{ steps.verify.outcome }}**"
            fi
          } > .work/pr-body.md

      - name: Open pull request
        if: steps.detect.outputs.state_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # A PAT here lets the PR trigger the Integration tests workflow; github.token PRs do not.
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: true
          add-paths: |
            src/test/**
            .sync/state.json
          commit-message: "Sync integration tests (impact: ${{ steps.detect.outputs.impact || 'baseline' }})"
          title: "Sync integration tests (impact: ${{ steps.detect.outputs.impact || 'baseline' }})"
          body-path: .work/pr-body.md
          labels: automated-test-sync
          # A red suite needs a human look: either the tests or the service is wrong.
          draft: ${{ steps.verify.outcome == 'failure' }}

      - name: Upload change summary and service logs
        if: always() && steps.detect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: sync-diagnostics
          path: |
            .work/changes/
            .work/run/*.log
            .work/claude-report.md

      - name: Stop services
        if: always()
        run: scripts/stop-services.sh
