name: Sync tests with tracked repositories

# Looks for changes in the tracked service repositories since the last sync. When something that can
# affect the API changed, Claude adds or refactors the integration tests, and the result is opened as a PR.
on:
#  schedule:
#    - cron: "0 5 * * 1-5"   # weekdays 05:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [tracked-repo-updated]

concurrency:
  group: sync-tests
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: auto/sync-tests
  # claude or copilot; set the SYNC_AGENT repository variable to switch.
  SYNC_AGENT: ${{ vars.SYNC_AGENT || 'claude' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Skip while an earlier sync PR is still open
        id: guard
        run: |
          open=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "::notice::A sync PR from $SYNC_BRANCH is still open; merge or close it first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-java@v6
        if: steps.guard.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install the agent CLI
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ "$SYNC_AGENT" = "copilot" ]; then npm install -g @github/copilot; else npm install -g @anthropic-ai/claude-code; fi

      # The same script runs locally; see scripts/sync.sh. Exit status 2 means the updated suite is red,
      # which still gets a (draft) PR.
      - name: Sync tests
        id: detect
        if: steps.guard.outputs.skip == 'false'
        run: scripts/sync.sh --agent "$SYNC_AGENT" || [ $? -eq 2 ]
        env:
          GH_TOKEN: ${{ secrets.TRACKED_REPOS_TOKEN || github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Open pull request
        if: steps.detect.outputs.state_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # A PAT here lets the PR trigger the Integration tests workflow; github.token PRs do not.
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: true
          add-paths: |
            src/test/**
            .sync/state.json
          commit-message: "Sync integration tests (impact: ${{ steps.detect.outputs.impact || 'baseline' }})"
          title: "Sync integration tests (impact: ${{ steps.detect.outputs.impact || 'baseline' }})"
          body-path: .work/pr-body.md
          labels: automated-test-sync
          # A red suite needs a human look: either the tests or the service is wrong.
          draft: ${{ steps.detect.outputs.verify == 'failure' }}

      - name: Upload change summary and service logs
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: sync-diagnostics
          path: |
            .work/changes/
            .work/run/*.log
            .work/agent.log
            .work/claude-report.md
